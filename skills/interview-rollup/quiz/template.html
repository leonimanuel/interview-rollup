<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview quiz</title>
<style>
  /* Follows the system theme; a host page can force one with data-theme. */
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f6f5f1, #141413);
    --surface: light-dark(#ffffff, #1e1e1c);
    --ink: light-dark(#1c1c1a, #ecebe6);
    --muted: light-dark(#6b6a65, #9b9993);
    --line: light-dark(#e2e0d9, #34332f);
    --accent: light-dark(#2f5bd3, #86a3f2);
    --accent-ink: light-dark(#ffffff, #10131c);
    --accent-soft: light-dark(#e7ecfb, #232d48);
    --ok: light-dark(#1d7a49, #62c590);
    --ok-soft: light-dark(#e2f3e9, #1a3326);
    --bad: light-dark(#b3261e, #f08b81);
    --bad-soft: light-dark(#fbe8e6, #3a201c);
    --shadow: 0 6px 20px light-dark(rgba(0,0,0,.14), rgba(0,0,0,.5));
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  .eyebrow { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font-size: 26px; line-height: 1.25; }
  .meta { margin: 6px 0 28px; color: var(--muted); }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; margin-bottom: 16px;
  }
  .card-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
  .num {
    display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  h2 { margin: 0 0 6px; font-size: 18px; line-height: 1.4; }
  .hint, .status { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .status { margin: 0; }

  /* Touch scrolls the page and moves cards by tapping; a mouse or pen can also drag. */
  .chip {
    display: block; width: 100%; min-height: 44px; padding: 10px 12px; text-align: left;
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px;
    cursor: grab; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .dragging { opacity: .45; }
  .ghost {
    position: fixed; left: 0; top: 0; z-index: 10; pointer-events: none;
    box-shadow: var(--shadow); border-color: var(--accent);
  }

  /* order */
  .order { list-style: none; margin: 0; padding: 0; counter-reset: step; display: grid; gap: 8px; }
  .order li { counter-increment: step; display: flex; gap: 10px; align-items: center; }
  .order li::before {
    content: counter(step); flex: none; width: 24px; text-align: right; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* match */
  .match { display: grid; gap: 8px; margin-bottom: 12px; }
  .mrow { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; align-items: center; }
  .left { font-weight: 600; }
  .slot, .pool { border: 1.5px dashed var(--line); border-radius: 8px; }
  .slot { min-height: 46px; display: flex; }
  .slot > .chip { background: transparent; }
  .pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; min-height: 62px; }
  .pool > .chip { width: auto; }
  .pool:empty::before { content: "All placed"; color: var(--muted); font-size: 14px; align-self: center; padding: 0 4px; }
  .over { border-color: var(--accent); background: var(--accent-soft); }
  @media (max-width: 520px) { .mrow { grid-template-columns: 1fr; gap: 4px; } .mrow + .mrow { margin-top: 6px; } }

  /* pick */
  .pick { display: grid; gap: 8px; }
  .opt {
    display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  .opt input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); }
  .opt .why { grid-column: 2; font-size: 14px; color: var(--muted); display: none; }
  .card[data-state] .opt .why { display: block; }

  /* marks after Check: each renderer tints the node it grades */
  .ok { border-color: var(--ok); background: var(--ok-soft); }
  .bad { border-color: var(--bad); background: var(--bad-soft); }

  .card-foot { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
  .btn {
    min-height: 40px; padding: 8px 16px; font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .result { font-weight: 600; }
  .card[data-state="ok"] .result { color: var(--ok); }
  .card[data-state="bad"] .result { color: var(--bad); }
  .explain { margin: 12px 0 0; color: var(--muted); font-size: 15px; }

  .send { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
  .send p { margin: 0 0 12px; color: var(--muted); }
  .send-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  pre {
    white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; padding: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 13px;
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
const QUIZ = /*__QUIZ__*/null;

const el = (tag, cls, txt) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
};
const chipButton = txt => { const b = el('button', 'chip', txt); b.type = 'button'; return b; };
const under = (ev, sel) => { const t = document.elementFromPoint(ev.clientX, ev.clientY); return t && t.closest(sel); };

// A shuffled order of 0..n-1 that is never the answer itself.
function shuffled(n) {
  let idx;
  do {
    idx = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  } while (n > 1 && idx.every((v, i) => v === i));
  return idx;
}

// One gesture per press: a press that moves under 6px is a tap; a mouse or pen press that moves
// further is a drag. Touch never drags (the page scrolls). Keyboard activation arrives as a click.
function gesture(node, { ghost, onMove, onDrop, onTap }) {
  node.addEventListener('click', e => { if (e.detail === 0) onTap(); });
  node.addEventListener('pointerdown', down => {
    if (down.button !== 0) return;
    const canDrag = down.pointerType !== 'touch';
    let moved = false, g = null, ox = 0, oy = 0;
    const move = ev => {
      if (!moved) {
        if (Math.hypot(ev.clientX - down.clientX, ev.clientY - down.clientY) < 6) return;
        moved = true;
        if (!canDrag) return;
        node.classList.add('dragging');
        if (ghost) {
          const r = node.getBoundingClientRect();
          g = node.cloneNode(true);
          g.classList.add('ghost');
          g.style.width = r.width + 'px';
          ox = down.clientX - r.left; oy = down.clientY - r.top;
          document.body.appendChild(g);
        }
      }
      if (!canDrag) return;
      ev.preventDefault();
      if (g) g.style.transform = `translate(${ev.clientX - ox}px, ${ev.clientY - oy}px)`;
      if (onMove) onMove(ev);
    };
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      node.classList.remove('dragging');
      if (g) g.remove();
      if (ev.type !== 'pointerup') return;
      if (!moved) onTap();
      else if (canDrag && onDrop) onDrop(ev);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}

// The card picked by a tap, waiting for a second tap to say where it goes.
function picker() {
  let current = null;
  return {
    get current() { return current; },
    set(chip) { this.clear(); current = chip; chip.classList.add('selected'); },
    clear() { if (current) current.classList.remove('selected'); current = null; },
  };
}

// Each renderer fills `body` and returns:
//   grade()  -> [[node to tint, right?], ...]
//   correct  -> the right answer, shown when it's wrong ('' if the options explain themselves)
//   text()   -> this answer for the copy-back
const renderers = {
  order(q, body, dirty) {
    const list = el('ol', 'order');
    const sel = picker();
    for (const i of shuffled(q.items.length)) {
      const li = el('li');
      const chip = chipButton(q.items[i]);
      chip.dataset.i = i;
      li.appendChild(chip);
      list.appendChild(li);
      gesture(chip, {
        onMove(ev) {
          const t = under(ev, '.order > li');
          if (!t || t === li || t.parentNode !== list) return;
          const r = t.getBoundingClientRect();
          const ref = ev.clientY < r.top + r.height / 2 ? t : t.nextSibling;
          if (ref === li || ref === li.nextSibling) return;
          list.insertBefore(li, ref);
          dirty();
        },
        onTap() {
          const picked = sel.current;
          if (!picked) return sel.set(chip);
          if (picked !== chip) {
            const rows = [...list.children], from = picked.parentNode;
            list.insertBefore(from, rows.indexOf(from) < rows.indexOf(li) ? li.nextSibling : li);
            dirty();
          }
          sel.clear();
        },
      });
    }
    body.append(el('p', 'hint', 'Tap an item, then tap where it goes (or drag with a mouse).'), list);
    const chips = () => [...list.children].map(li => li.firstChild);
    return {
      grade: () => chips().map((c, pos) => [c, +c.dataset.i === pos]),
      correct: 'Correct order: ' + q.items.map((s, i) => `${i + 1}. ${s}`).join('  '),
      text: () => `   My order: ${chips().map(c => c.textContent).join(' → ')}\n   Correct:  ${q.items.join(' → ')}`,
    };
  },

  match(q, body, dirty) {
    const rows = el('div', 'match');
    const pool = el('div', 'pool');
    pool.dataset.drop = '';
    const sel = picker();
    const slots = q.pairs.map(p => {
      const row = el('div', 'mrow');
      const slot = el('div', 'slot');
      slot.dataset.drop = '';
      row.append(el('div', 'left', p.left), slot);
      rows.appendChild(row);
      return slot;
    });
    // Put a chip in a zone; a slot's occupant swaps to wherever the chip came from.
    const place = (chip, zone) => {
      const occupant = zone === pool ? null : zone.querySelector('.chip');
      if (occupant === chip) return;
      if (occupant) chip.parentNode.appendChild(occupant);
      zone.appendChild(chip);
      dirty();
    };
    let over = null;
    const setOver = z => {
      if (z === over) return;
      if (over) over.classList.remove('over');
      over = z;
      if (z) z.classList.add('over');
    };
    const zoneAt = ev => { const z = under(ev, '[data-drop]'); return z && body.contains(z) ? z : null; };

    for (const i of shuffled(q.pairs.length)) {
      const chip = chipButton(q.pairs[i].right);
      chip.dataset.i = i;
      pool.appendChild(chip);
      gesture(chip, {
        ghost: true,
        onMove: ev => setOver(zoneAt(ev)),
        onDrop(ev) { setOver(null); const z = zoneAt(ev); if (z) place(chip, z); sel.clear(); },
        onTap() {
          const picked = sel.current;
          if (picked === chip) return sel.clear();
          if (picked && chip.parentNode !== pool) { place(picked, chip.parentNode); return sel.clear(); }
          sel.set(chip);
        },
      });
    }
    for (const z of [...slots, pool]) {
      z.addEventListener('click', e => {
        if (!sel.current || e.target.closest('.chip')) return;
        place(sel.current, z);
        sel.clear();
      });
    }
    body.append(el('p', 'hint', 'Tap a card, then tap its spot (or drag with a mouse).'), rows, pool);
    const placed = i => slots[i].querySelector('.chip');
    return {
      grade: () => slots.map((s, i) => [s, +placed(i)?.dataset.i === i]),
      correct: 'Correct: ' + q.pairs.map(p => `${p.left} → ${p.right}`).join('; ') + '.',
      text: () => q.pairs.map((p, i) =>
        `   ${p.left} → mine: ${placed(i)?.textContent ?? '(empty)'} · correct: ${p.right}`).join('\n'),
    };
  },

  pick(q, body, dirty) {
    const list = el('div', 'pick');
    const boxes = [];
    for (const i of shuffled(q.options.length)) {
      const o = q.options[i];
      const label = el('label', 'opt');
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.dataset.i = i;
      box.addEventListener('change', dirty);
      label.append(box, el('span', '', o.label), el('span', 'why', o.why));
      list.appendChild(label);
      boxes.push(box);
    }
    body.append(el('p', 'hint', 'Tick every one it needs.'), list);
    const opt = b => q.options[+b.dataset.i];
    const names = list => list.map(o => o.label).join(', ') || '(none)';
    return {
      grade: () => boxes.map(b => [b.parentNode, b.checked === opt(b).correct]),
      correct: '',
      text: () => `   Mine:    ${names(boxes.filter(b => b.checked).map(opt))}\n   Correct: ${names(q.options.filter(o => o.correct))}`,
    };
  },
};

const KIND = { order: 'Put in order', match: 'Match', pick: 'Pick the components' };

function build() {
  const app = document.getElementById('app');
  if (!QUIZ || !Array.isArray(QUIZ.questions)) {
    app.append(el('h1', '', 'No quiz here yet'), el('p', 'meta', 'Build this page with quiz/build.py and a quiz JSON file.'));
    return;
  }
  document.title = QUIZ.title;
  app.append(el('p', 'eyebrow', 'Interview prep'), el('h1', '', QUIZ.title), el('p', 'meta', `${QUIZ.role} · ${QUIZ.angle}`));

  const questions = QUIZ.questions.map((q, n) => {
    const card = el('section', 'card');
    const head = el('div', 'card-head');
    head.append(el('span', 'num', String(n + 1)), el('span', '', KIND[q.type]));
    const body = el('div');
    const foot = el('div', 'card-foot');
    const check = el('button', 'btn', 'Check');
    check.type = 'button';
    const result = el('span', 'result');
    foot.append(check, result);
    const explain = el('p', 'explain');
    explain.hidden = true;
    card.append(head, el('h2', '', q.prompt), body, foot, explain);
    app.appendChild(card);

    // Any change after a Check clears its marks.
    const dirty = () => {
      if (!card.dataset.state) return;
      delete card.dataset.state;
      card.querySelectorAll('.ok, .bad').forEach(e => e.classList.remove('ok', 'bad'));
      result.textContent = '';
      explain.hidden = true;
    };
    const api = renderers[q.type](q, body, dirty);
    const grade = () => {
      const marks = api.grade();
      const score = marks.filter(([, ok]) => ok).length;
      return { marks, score, total: marks.length, right: score === marks.length };
    };
    check.addEventListener('click', () => {
      dirty();
      const g = grade();
      g.marks.forEach(([node, ok]) => node.classList.add(ok ? 'ok' : 'bad'));
      card.dataset.state = g.right ? 'ok' : 'bad';
      result.textContent = g.right ? 'Right' : `${g.score} of ${g.total} right`;
      const words = [g.right ? '' : api.correct, q.why].filter(Boolean).join(' ');
      explain.textContent = words;
      explain.hidden = !words;
    });
    return { q, api, grade };
  });

  const send = el('section', 'send');
  send.append(el('p', '', 'Done? Copy your answers and paste them into your Claude session for coaching.'));
  const row = el('div', 'send-row');
  const copy = el('button', 'btn primary', 'Copy my answers');
  copy.type = 'button';
  const status = el('span', 'status');
  row.append(copy, status);
  const details = el('details');
  details.hidden = true;
  const pre = el('pre');
  details.append(el('summary', '', 'Show the text'), pre);
  send.append(row, details);
  app.appendChild(send);

  copy.addEventListener('click', async () => {
    const lines = [`Interview prep quiz: ${QUIZ.role} · ${QUIZ.angle}`, ''];
    questions.forEach(({ q, api, grade }, n) => {
      const g = grade();
      lines.push(`${n + 1}. ${q.prompt} (${KIND[q.type].toLowerCase()}; ${g.score} of ${g.total} right)`, api.text(), '');
    });
    lines.push('Coach me on these: for each, what landed, what was missing, and a tighter answer in my words.');
    const text = lines.join('\n');
    pre.textContent = text;
    details.hidden = false;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (_) {
      const range = document.createRange();
      range.selectNodeContents(pre);
      const s = getSelection();
      s.removeAllRanges();
      s.addRange(range);
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      s.removeAllRanges();
    }
    status.textContent = ok ? 'Copied. Paste it into your Claude session.' : 'Copy it from the text below.';
    if (!ok) details.open = true;
  });
}
build();
</script>
</body>
</html>
